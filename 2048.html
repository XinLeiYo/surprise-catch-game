<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root{
    --bg: #2b1b3d;
    --bg2: #4a2c5e;
    --board: #241533;
    --cell-empty: rgba(244,185,66,0.08);
    --gold: #f4b942;
    --coral: #ff6f61;
    --mint: #7fd8be;
    --cream: #f5e9da;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Nunito','Segoe UI',sans-serif;
    background: radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 65%);
    color: var(--cream);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #wrap{
    display:flex; flex-direction:column; align-items:center;
    padding: 16px 0 0 0; height:100vh;
  }
  h1{
    font-family:'Fredoka','Nunito',sans-serif;
    font-weight:700;
    font-size: clamp(24px, 6vw, 32px);
    color: var(--gold);
    margin: 0 0 10px 0;
    text-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  #hud{
    display:flex; gap:14px; margin-bottom:10px;
  }
  .scorebox{
    background: rgba(244,185,66,0.12);
    border: 1px solid rgba(244,185,66,0.3);
    border-radius: 10px;
    padding: 6px 16px;
    text-align:center;
    min-width: 70px;
  }
  .scorebox .lab{ font-size:11px; color: var(--mint); font-weight:700; }
  .scorebox .val{ font-size:18px; font-weight:800; color: var(--cream); }
  #boardHolder{
    position:relative;
    width: min(90vw, 400px);
    height: min(90vw, 400px);
    background: var(--board);
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(244,185,66,0.2);
  }
  #grid{
    position:relative;
    width:100%; height:100%;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }
  .cellbg{
    background: var(--cell-empty);
    border-radius: 8px;
  }
  .tile{
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    border-radius: 8px;
    font-family:'Fredoka','Nunito',sans-serif;
    font-weight:800;
    transition: left .1s ease, top .1s ease, transform .1s ease;
    color: #3a2500;
  }
  .tile.new{ animation: pop .18s ease; }
  .tile.merged{ animation: pop .15s ease; }
  @keyframes pop{
    0%{ transform:scale(0.4); }
    70%{ transform:scale(1.12); }
    100%{ transform:scale(1); }
  }
  #controls{
    margin-top: 14px;
    display:flex; gap:10px;
  }
  button{
    font-family:'Fredoka','Nunito',sans-serif;
    font-weight:600;
    border:none; cursor:pointer;
    padding: 9px 18px;
    border-radius: 12px;
    font-size:14px;
    background: var(--mint);
    color:#173028;
  }
  button.alt{ background: var(--coral); color:#3a0f0b; }
  #hint{
    margin-top:10px; font-size:12px; color: var(--cream); opacity:0.7; text-align:center; max-width:340px;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px;
    background: rgba(20,10,32,0.88);
    border-radius: 16px;
    text-align:center;
  }
  .overlay h2{ font-family:'Fredoka',sans-serif; color: var(--gold); margin:0; font-size:22px; }
  .overlay p{ margin:0; color: var(--cream); opacity:0.85; font-size:14px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <h1>2048</h1>
  <div id="hud">
    <div class="scorebox"><div class="lab">分數</div><div class="val" id="scoreVal">0</div></div>
    <div class="scorebox"><div class="lab">最佳</div><div class="val" id="bestVal">0</div></div>
  </div>

  <div id="boardHolder">
    <div id="grid"></div>
    <div class="overlay hidden" id="endOverlay">
      <h2 id="endTitle">遊戲結束</h2>
      <p id="endDetail">分數：0</p>
      <button id="retryBtn">再玩一次</button>
    </div>
  </div>

  <div id="controls">
    <button id="newGameBtn">🔄 新遊戲</button>
    <button id="undoBtn" class="alt">↩ 復原</button>
  </div>
  <div id="hint">電腦用方向鍵操作，手機用手指滑動（上下左右）。合併相同數字的方塊，湊到 2048 就贏了！</div>
</div>

<script>
(function(){
  const SIZE = 4;
  const gridEl = document.getElementById('grid');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const endOverlay = document.getElementById('endOverlay');
  const endTitle = document.getElementById('endTitle');
  const endDetail = document.getElementById('endDetail');
  const newGameBtn = document.getElementById('newGameBtn');
  const undoBtn = document.getElementById('undoBtn');
  const retryBtn = document.getElementById('retryBtn');

  let board, score, best, prevState, wonAnnounced;

  const COLORS = {
    2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563',
    32:'#f67c5f', 64:'#f65e3b', 128:'#edcf72', 256:'#edcc61',
    512:'#edc850', 1024:'#edc53f', 2048:'#edc22e'
  };
  function tileColor(v){ return COLORS[v] || '#3c2a63'; }
  function textColor(v){ return v<=4 ? '#5b4632' : '#fff8ea'; }
  function fontSize(v){
    if(v<100) return 30;
    if(v<1000) return 25;
    return 19;
  }

  // build background cells once
  for(let i=0;i<SIZE*SIZE;i++){
    const c = document.createElement('div');
    c.className = 'cellbg';
    gridEl.appendChild(c);
  }
  const tileLayer = document.createElement('div');
  tileLayer.style.position='absolute';
  tileLayer.style.inset='10px';
  document.getElementById('boardHolder').appendChild(tileLayer);

  function emptyBoard(){
    return Array.from({length:SIZE}, ()=>Array(SIZE).fill(0));
  }

  function loadBest(){
    try{ return parseInt(localStorage_fallback_get()) || 0; }catch(e){ return 0; }
  }
  // no localStorage in artifact sandbox: keep best in-memory only
  let bestMem = 0;
  function localStorage_fallback_get(){ return bestMem; }

  function addRandomTile(){
    const empties = [];
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(board[r][c]===0) empties.push([r,c]);
    if(empties.length===0) return null;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    const val = Math.random()<0.9 ? 2 : 4;
    board[r][c] = val;
    return [r,c];
  }

  function cloneBoard(b){ return b.map(row=>row.slice()); }

  function startGame(){
    board = emptyBoard();
    score = 0;
    prevState = null;
    wonAnnounced = false;
    addRandomTile();
    addRandomTile();
    endOverlay.classList.add('hidden');
    render(true);
  }

  function render(initial){
    tileLayer.innerHTML = '';
    scoreVal.textContent = score;
    bestVal.textContent = bestMem;
    const holder = document.getElementById('boardHolder');
    const size = holder.getBoundingClientRect().width - 20;
    const gap = 10;
    const cell = (size - gap*(SIZE-1)) / SIZE;

    for(let r=0;r<SIZE;r++){
      for(let c=0;c<SIZE;c++){
        const v = board[r][c];
        if(v===0) continue;
        const t = document.createElement('div');
        t.className = 'tile' + (initial? '' : '');
        t.style.width = cell+'px';
        t.style.height = cell+'px';
        t.style.left = c*(cell+gap)+'px';
        t.style.top = r*(cell+gap)+'px';
        t.style.background = tileColor(v);
        t.style.color = textColor(v);
        t.style.fontSize = fontSize(v)+'px';
        t.textContent = v;
        tileLayer.appendChild(t);
      }
    }
  }

  function boardsEqual(a,b){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) if(a[r][c]!==b[r][c]) return false;
    return true;
  }

  function slideRowLeft(row){
    const nums = row.filter(v=>v!==0);
    const merged = [];
    let gained = 0;
    for(let i=0;i<nums.length;i++){
      if(nums[i]!==0 && nums[i]===nums[i+1]){
        const val = nums[i]*2;
        merged.push(val);
        gained += val;
        if(val===2048) wonAnnounced = wonAnnounced || false;
        nums[i+1] = 0;
      } else if(nums[i]!==0){
        merged.push(nums[i]);
      }
    }
    while(merged.length < SIZE) merged.push(0);
    return {row:merged, gained};
  }

  function rotateBoardCW(b){
    const nb = emptyBoard();
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++) nb[c][SIZE-1-r] = b[r][c];
    return nb;
  }

  function move(dir){
    // dir: 'left','right','up','down'
    let working = cloneBoard(board);
    let rotations = 0;
    if(dir==='up') rotations = 3;
    else if(dir==='right') rotations = 2;
    else if(dir==='down') rotations = 1;

    for(let i=0;i<rotations;i++) working = rotateBoardCW(working);

    let totalGain = 0;
    const newBoard = emptyBoard();
    for(let r=0;r<SIZE;r++){
      const res = slideRowLeft(working[r]);
      newBoard[r] = res.row;
      totalGain += res.gained;
    }

    let result = newBoard;
    const backRotations = (4 - rotations) % 4;
    for(let i=0;i<backRotations;i++) result = rotateBoardCW(result);

    if(!boardsEqual(result, board)){
      prevState = { board: cloneBoard(board), score };
      board = result;
      score += totalGain;
      if(score > bestMem) bestMem = score;
      const pos = addRandomTile();
      render(false);
      checkGameOver();
      checkWin();
    }
  }

  function checkWin(){
    if(wonAnnounced) return;
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(board[r][c]===2048){
        wonAnnounced = true;
        endTitle.textContent = '🎉 你贏了！';
        endDetail.textContent = '湊到 2048 了！分數：' + score + '（可以繼續玩累積更高分）';
        endOverlay.classList.remove('hidden');
        retryBtn.textContent = '繼續玩';
        retryBtn.onclick = ()=>{ endOverlay.classList.add('hidden'); };
      }
    }
  }

  function canMove(){
    for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
      if(board[r][c]===0) return true;
      if(c<SIZE-1 && board[r][c]===board[r][c+1]) return true;
      if(r<SIZE-1 && board[r][c]===board[r+1][c]) return true;
    }
    return false;
  }

  function checkGameOver(){
    if(!canMove()){
      endTitle.textContent = '遊戲結束';
      endDetail.textContent = '沒有可移動的空間了，分數：' + score;
      endOverlay.classList.remove('hidden');
      retryBtn.textContent = '再玩一次';
      retryBtn.onclick = startGame;
    }
  }

  // keyboard
  window.addEventListener('keydown', e=>{
    const map = { 'ArrowLeft':'left', 'ArrowRight':'right', 'ArrowUp':'up', 'ArrowDown':'down' };
    if(map[e.key]){
      e.preventDefault();
      move(map[e.key]);
    }
  });

  // touch swipe
  let touchStartX=0, touchStartY=0;
  const holder = document.getElementById('boardHolder');
  holder.addEventListener('touchstart', e=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  holder.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)){
      move(dx>0 ? 'right' : 'left');
    } else {
      move(dy>0 ? 'down' : 'up');
    }
  }, {passive:true});

  newGameBtn.onclick = startGame;
  undoBtn.onclick = ()=>{
    if(prevState){
      board = prevState.board;
      score = prevState.score;
      prevState = null;
      endOverlay.classList.add('hidden');
      render(false);
    }
  };
  retryBtn.onclick = startGame;

  window.addEventListener('resize', ()=>render(false));

  startGame();
})();
</script>
</body>
</html>
